; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = LilyGo-T-PCIE

; Options communes à tous les environnements :
; les programmes de test matériel (src/tests_hw/) ne sont pas compilés
; avec le firmware, ils ont chacun leur propre environnement.
[env]
build_src_filter = +<*> -<tests_hw/>

[env:LilyGo-T-PCIE]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.f_flash = 40000000L
board_build.partitions = no_ota.csv
lib_deps = 
	https://github.com/ivanseidel/ArduinoThread.git
	https://github.com/sparkfun/SparkFun_u-blox_GNSS_Arduino_Library.git
	https://github.com/sparkfun/SparkFun_AS7265x_Arduino_Library.git
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.0.4
	heman/AsyncMqttClient-esphome@^2.1.0


[env:spectro_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
board_build.f_flash = 40000000L
board_build.partitions = no_ota.csv
build_src_filter = -<*> +<tests_hw/spectro_test.cpp>
